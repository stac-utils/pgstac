[project]
name = "pgstac-migrate"
version = "0.9.11-dev"
description = "Apply PgSTAC database migrations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pgpkg>=0.1.1,<0.2",
    "psycopg[binary]>=3.1.0",
]

[project.scripts]
pgstac-migrate = "pgstac_migrate.cli:main"

[dependency-groups]
dev = [
    "ruff==0.15.22",
    "ty==0.0.61",
]
test = [
    "pytest>=8.3,<9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgstac_migrate"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["pgstac_migrate"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/pgstac_migrate", "tests"]

[tool.pytest.ini_options]
addopts = "-vv"
