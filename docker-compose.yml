services:
  pgstac:
    image: pgstac
    env_file:
      - .env
    build:
      context: .
      network: host
      dockerfile: docker/pgstac/Dockerfile
      target: pgstac
    platform: linux/amd64
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-username}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-postgis}
      - PGHOST=/var/run/postgresql
      - PGPORT=5432
      - PGUSER=${PGUSER:-username}
      - PGPASSWORD=${PGPASSWORD:-password}
      - PGDATABASE=${PGDATABASE:-postgis}
    ports:
      - "${PGPORT:-5439}:5432"
    volumes:
      - pgstac-pgdata:/var/lib/postgresql/data
    command: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h /var/run/postgresql -p 5432 -U ${PGUSER:-username} -d ${PGDATABASE:-postgis}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
  pypgstac:
    image: pypgstac
    env_file:
      - .env
    build:
      context: .
      network: host
      dockerfile: docker/pypgstac/Dockerfile
      target: pypgstac
    platform: linux/amd64
    environment:
      - PGHOST=pgstac
      - PGPORT=5432
      - PGUSER=${PGUSER:-username}
      - PGPASSWORD=${PGPASSWORD:-password}
      - PGDATABASE=${PGDATABASE:-postgis}
    volumes:
      # The Rust test suite (test_rust) needs the builder scripts and the pgstac-rs crate, neither of
      # which the image bakes in. Mounting them makes `scripts/test` run the same Rust suite locally as
      # CI does.
      - ./scripts:/opt/scripts
      - ./src/pgstac-rs:/opt/src/pgstac-rs
      # Persistent cargo dep-registry + build-artifact caches so repeat Rust runs are incremental instead
      # of recompiling from scratch. Backed by /home/user/.cargo and /opt/cargo-target (CARGO_HOME /
      # CARGO_TARGET_DIR in the image), both owned by uid 1000 so the volumes init writable.
      - pgstac-cargo-home:/home/user/.cargo
      - pgstac-cargo-target:/opt/cargo-target
    depends_on:
      pgstac:
        condition: service_healthy
volumes:
  pgstac-pgdata:
  pgstac-cargo-home:
  pgstac-cargo-target:
